<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>匕首之心角色卡</title>
<style>
:root {
  --bg: #0e1117;
  --card: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --dim: #6e7681;
  --white: #e6edf3;
  --hope: #3fb950;
  --fear: #f85149;
  --accent: #58a6ff;
  --gold: #e3b341;
  --stress: #f0883e;
  --hover: #21262d;
  --input-bg: #0d1117;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Code", "Fira Code", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  padding: 8px;
  padding-bottom: 36px;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.sheet {
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.section { background: var(--card); padding: 10px 12px; }
.section-title {
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
  -webkit-user-select: none;
  user-select: none;
}
.header {
  display: flex;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px;
  background: linear-gradient(180deg, #161b22, #0d1117);
}
.header-main {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 0 1 auto;
}
.header-info {
  min-width: 0;
  flex: 0 1 auto;
}
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 6px;
  border: 1px solid var(--border);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--dim);
  background: #000;
  flex-shrink: 0;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.avatar-button {
  padding: 0;
  cursor: pointer;
}
.avatar.avatar-action {
  background: var(--hover);
  color: var(--text);
  border-style: dashed;
  cursor: pointer;
  font-size: 11px;
  line-height: 1.2;
  text-align: center;
  padding: 6px;
}
.avatar.avatar-action:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.char-name {
  display: block;
  max-width: 100%;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.char-name:hover { color: var(--accent); }
.char-sub {
  font-size: 11px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  gap: 6px;
  text-align: right;
  flex: 0 0 auto;
  margin-left: auto;
}
.defense-item { color: var(--text); font-size: 15px; font-weight: 600; white-space: nowrap; }
.defense-key { color: var(--dim); margin-right: 6px; font-size: 12px; font-weight: 500; }
.inline-link { color: var(--white); cursor: pointer; }
.inline-link:hover { color: var(--accent); }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--border); }
.cell {
  background: var(--card);
  padding: 8px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.cell-label { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
.cell-main { display: flex; align-items: center; justify-content: center; gap: 4px; }
.cell-val {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  color: var(--white);
  cursor: pointer;
  min-width: 20px;
  text-align: center;
}
.cell-val:hover { color: var(--accent); }
.attr-roll-btn {
  border: none;
  background: transparent;
  color: var(--dim);
  padding: 0;
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
}
.attr-roll-btn:hover { color: var(--accent); }
.resource-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
.resource-card {
  flex: 1 1 160px;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  background: var(--input-bg);
}
.res-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.res-label { font-size: 11px; color: var(--dim); min-width: 30px; }
.res-btn {
  width: 22px;
  height: 22px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--hover);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.res-btn:hover { border-color: var(--accent); color: var(--accent); }
.res-val {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  min-width: 24px;
  text-align: center;
  cursor: pointer;
}
.res-val:hover { color: var(--accent); }
.res-hp .res-val { color: var(--fear); }
.res-stress .res-val { color: var(--stress); }
.res-armor .res-val { color: var(--accent); }
.res-hope .res-val { color: var(--hope); }
.exp-wrap {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.exp-card {
  flex: 1 1 140px;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 8px;
  background: var(--input-bg);
  display: flex;
  align-items: center;
  gap: 8px;
}
.exp-name {
  flex: 1;
  font-size: 12px;
  cursor: pointer;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.exp-name:hover { color: var(--accent); }
.exp-mod {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--hope);
  cursor: pointer;
  min-width: 28px;
  text-align: right;
}
.exp-mod:hover { color: var(--accent); }
.equip-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.equip-block {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 6px;
  background: var(--input-bg);
}
.equip-title { font-size: 12px; font-weight: 600; color: var(--white); margin-bottom: 4px; cursor: pointer; }
.equip-title:hover { color: var(--accent); }
.equip-line { font-size: 11px; color: var(--dim); cursor: pointer; padding: 1px 0; white-space: pre-wrap; }
.equip-line:hover { color: var(--text); }
.gold-wrap { display: flex; gap: 16px; flex-wrap: wrap; }
.gold-row { display: flex; align-items: center; gap: 8px; }
.gold-label { font-size: 11px; color: var(--gold); min-width: 40px; }
.gold-val { font-family: var(--mono); font-size: 14px; color: var(--gold); cursor: pointer; }
.gold-val:hover { color: var(--accent); }
.cards-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.card-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.card-item img {
  width: 100%;
  height: auto;
  display: block;
  background: #000;
}
.card-meta {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--white);
}
.card-type {
  font-size: 11px;
  color: var(--accent);
}
.card-desc {
  font-size: 11px;
  color: var(--dim);
  white-space: pre-wrap;
}
.empty-state {
  color: var(--dim);
  font-size: 12px;
  font-style: italic;
  padding: 12px;
}
.dice-mod-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; }
.dice-mod-row.center { justify-content: center; }
.modal-mode-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.modal-chip {
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--hover);
  color: var(--text);
  padding: 7px 6px;
  cursor: pointer;
  font-size: 12px;
  text-align: center;
}
.modal-chip:hover { border-color: var(--accent); }
.modal-chip.active {
  border-color: var(--accent);
  background: rgba(88, 166, 255, .16);
  color: var(--white);
}
.dice-mod-input {
  width: 56px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 3px 6px;
  font-size: 12px;
  text-align: center;
}
.roll-note { color: var(--dim); font-size: 11px; }
.roll-fixed-mod { color: var(--accent); font-weight: 600; }
.inline-edit {
  background: var(--input-bg);
  border: 1px solid var(--accent);
  border-radius: 3px;
  color: #fff;
  font-size: inherit;
  font-family: inherit;
  text-align: center;
  padding: 1px 4px;
  outline: none;
}
.empty { padding: 30px; text-align: center; color: var(--dim); font-style: italic; }
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .65);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  width: 90%;
  max-width: 300px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
}
.modal-title { font-size: 16px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 12px; }
.modal-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
.modal-btn {
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--hover);
  color: var(--text);
  padding: 8px;
  cursor: pointer;
  font-size: 12px;
  text-align: center;
}
.modal-btn:hover { border-color: var(--accent); }
.modal-btn.hope-btn {
  background: rgba(63, 185, 80, .1);
  border-color: rgba(63, 185, 80, .3);
  color: var(--hope);
  font-weight: 600;
}
.modal-btn.hope-btn:hover { background: rgba(63, 185, 80, .2); }
.modal-cancel {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--dim);
  cursor: pointer;
  padding: 8px 0;
  margin-top: 8px;
  font-size: 12px;
}
.modal-cancel:hover { color: #fff; }
.roll-preview-label {
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 4px;
}
.roll-preview-command {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--white);
  word-break: break-all;
}
.import-json-input {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 8px;
  font-size: 12px;
  font-family: var(--mono);
  margin-bottom: 10px;
}
.import-json-error {
  color: var(--fear);
  font-size: 12px;
  min-height: 18px;
  margin-bottom: 8px;
  white-space: pre-wrap;
}
@media (max-width: 460px) {
  .grid6 { grid-template-columns: repeat(3, 1fr); }
  .equip-grid { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
}
@media (max-width: 360px) {
  .header { flex-direction: column; align-items: stretch; }
  .header-side {
    margin-left: 0;
    align-items: flex-start;
    text-align: left;
  }
}
</style>

<div id="app"></div>

<div id="rollModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">二元骰掷骰</div>
    <div class="modal-mode-row">
      <button id="modalToggleAdv" class="modal-chip" type="button" onclick="toggleRollOption('adv')">优势</button>
      <button id="modalToggleDis" class="modal-chip" type="button" onclick="toggleRollOption('dis')">劣势</button>
      <button id="modalToggleReaction" class="modal-chip" type="button" onclick="toggleRollOption('reaction')">反应</button>
    </div>
    <div class="dice-mod-row center roll-note">属性修正 <span id="modalAttrMod" class="roll-fixed-mod">+0</span></div>
    <div class="dice-mod-row center">
      <span>额外调整值</span>
      <input id="modalMod" class="dice-mod-input" type="number" value="0"/>
    </div>
    <div class="dice-mod-row center roll-note">总固定修正 = 属性修正 + 额外调整值</div>
    <div class="modal-actions">
      <button class="modal-btn hope-btn" onclick="execRoll()">掷骰</button>
    </div>
    <button class="modal-cancel" onclick="closeRollModal()">取消</button>
  </div>
</div>

  <input id="importJsonFile" type="file" accept=".json,application/json" hidden/>

<script>
var _windowId = null;
var _hostUpdateCallback = null;
var _hostListenerBound = false;
var _queuedPreviewPayload = null;
var _skinPreviewMode = false;
var _lastPreviewRollLabel = '';
var _lastPreviewRollCommand = '';
var _localAvatarUrl = '';
var _pendingRollLabel = '';
var _pendingAttrMod = 0;
var _pendingRollOptions = { adv: false, dis: false, reaction: false };

function postEvent(action, payload) {
  if (!_windowId) return;
  window.parent.postMessage({
    type: 'SEALCHAT_EVENT',
    version: 1,
    windowId: _windowId,
    action: action,
    payload: payload
  }, '*');
}

function dispatchIncomingUpdate(payload) {
  if (typeof _hostUpdateCallback === 'function') {
    _hostUpdateCallback(payload);
    return;
  }
  _queuedPreviewPayload = payload;
}

function bindSealchatHostUpdates() {
  if (_hostListenerBound) return;
  _hostListenerBound = true;
  window.addEventListener('message', function(e) {
    if (e.source !== window.parent) return;
    if (!e.data || e.data.type !== 'SEALCHAT_UPDATE') return;
    if (_windowId && _windowId !== e.data.payload.windowId) {
      _localAvatarUrl = '';
    }
    _windowId = e.data.payload.windowId;
    _skinPreviewMode = false;
    dispatchIncomingUpdate(e.data.payload);
  });
}

function buildPreviewPayload(jsonData) {
  var attrs = shallowClone(jsonData || {});
  return {
    name: attrs[INFO_KEYS.name] || attrs.NameTextbox || '',
    avatarUrl: attrs.avatarImageSrc || attrs.avatarUrl || '',
    attrs: attrs
  };
}

function persistSkinPreviewState() {
  if (!_skinPreviewMode) return;
  try {
    var storage = window.localStorage;
    if (!storage) return;
    var next = shallowClone(S.attrs || {});
    next[INFO_KEYS.name] = S.attrs[INFO_KEYS.name] || S.name || '';
    if (S.avatarUrl) next.avatarUrl = S.avatarUrl;
    storage.setItem('daggerheart_current_character', JSON.stringify(next));
  } catch (e) {}
}

function previewRollCommand(command, label) {
  _skinPreviewMode = true;
  _lastPreviewRollLabel = label || '掷骰';
  _lastPreviewRollCommand = command || '';
  window.__SEALCHAT_SKIN_PREVIEW_COMMAND__ = {
    label: _lastPreviewRollLabel,
    command: _lastPreviewRollCommand
  };
  render();
}

function tryLoadSkinApi() {
  if (window.parent !== window) return;
  if (document.querySelector('script[data-skin-api="1"]')) return;
  var script = document.createElement('script');
  script.src = '../skin_api.js';
  script.dataset.skinApi = '1';
  script.onerror = function() {};
  document.body.appendChild(script);
}

window.sealchat = {
  onUpdate: function(cb) {
    _hostUpdateCallback = cb;
    bindSealchatHostUpdates();
    if (_queuedPreviewPayload) {
      var queuedPayload = _queuedPreviewPayload;
      _queuedPreviewPayload = null;
      cb(queuedPayload);
    }
  },
  roll: function(template, label, args) {
    if (_windowId) {
      postEvent('ROLL_DICE', {
        roll: { template: template, label: label || '', args: args || {}, dispatchMode: 'template' }
      });
      return;
    }
    previewRollCommand(template, label || '掷骰');
  },
  updateAttrs: function(attrs) {
    if (_windowId) {
      postEvent('UPDATE_ATTRS', { attrs: attrs });
      return;
    }
    persistSkinPreviewState();
  }
};

var S = {
  name: '',
  avatarUrl: '',
    attrs: createInitialAttrs()
};

var ATTR_KEYS = {
